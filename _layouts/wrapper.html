
<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/anchor-js/anchor.min.js"></script>
        <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/main.css">
        <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:200,300,400,600,700" rel="stylesheet">
        <script src="https://use.fontawesome.com/releases/v5.0.6/js/all.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script data-goatcounter="https://robots.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
        
        <meta property="og:title" content="{{ page.title }}">
        <meta property="og:type" content="article" />
        <meta property="og:description" content="{{ page.subtitle }}">
        <meta property="og:image" content="https://roberts.work{{ page.image }}">
        <meta property="og:url" content="https://roberts.work{{ page.permalink }}">
        <meta name="twitter:card" content="summary_large_image">

        <link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/images/favicon.png"> 
        <title>Roberts: {{ page.title }}</title>
    </head>
    
    <body>

    <div class="header">
        <div class="Navbar">
            <nav class="Navbar__Items Navbar__Items--center">
                <a href="{{ site.url }}" class="logoLink" title="Jonny Robots"><img src="/images/jrobo.png" class="logo"/></a>
            </nav>
            <nav class="Navbar__Items Navbar__Items--right">
            </nav>
        </div>
        <script>
            function classToggle() {
                const navs = document.querySelectorAll('.Navbar__Items')
                navs.forEach(nav => nav.classList.toggle('Navbar__ToggleShow'));
            }
            document.querySelector('.Navbar__Link-toggle').addEventListener('click', classToggle);
        </script>

    </div>
    
    <div class="content">
        
        <div class="section first">
        {{ content }}
        </div>

        
    </div>

    <div class="footer">        
        <div class="last">
            <p><a href="https://linkedin.com/in/jonathanaroberts">About</a></p>
            <p class="f-text">
                Built by hand using <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> and <a href="https://codepen.io/charliearlie/pen/LdPgpx" target="_blank">Flexbox</a>. <br/>
                No cookies 🍪              
            </p>           
        </div>
    </div>

<script>
    anchors.options.visible = 'always';
    anchors.add('h2, h3, h4');
</script>
</body>
</html>
